version: '2'

services:
  nstat:
    image: intracom/nstat:proxy
    networks:
      sample_net:
        ipv4_address: 172.18.0.10

  controller:
    image: intracom/nstat:proxy
    depends_on:
      - node1
    networks:
      sample_net:
        ipv4_address: 172.18.0.11

  nbgen:
    image: intracom/nstat:proxy
    depends_on:
      - node2
    networks:
      sample_net:
        ipv4_address: 172.18.0.12

  mtcbench:
    image: intracom/nstat:proxy
    depends_on:
      - node2
    networks:
      sample_net:
        ipv4_address: 172.18.0.13

  mn01:
    image: intracom/nstat:proxy
    depends_on:
      - node2
    networks:
      sample_net:
        ipv4_address: 172.18.0.14
        
  mn02:
    image: intracom/nstat:proxy
    depends_on:
      - node2
    networks:
      sample_net:
        ipv4_address: 172.18.0.15        

networks:
  sample_net:
    driver: bridge
    ipam:
      driver: default
      config:
      - subnet: 172.18.0.0/24
        gateway: 172.18.0.1
