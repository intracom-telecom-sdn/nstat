version: '2'

services:
  nstat:
    image: intracom/nstat:proxy
    privileged: true
    hostname: nstat-node
    networks:
      sample_net:
        ipv4_address: 10.0.1.10

  controller:
    image: intracom/nstat:proxy
    privileged: true
    hostname: ctrl-node
    depends_on:
      - nstat
    networks:
      sample_net:
        ipv4_address: 10.0.1.11

  nbgen:
    image: intracom/nstat:proxy
    privileged: true
    hostname: nbgen-node
    depends_on:
      - nstat
    networks:
      sample_net:
        ipv4_address: 10.0.1.12

  mtcbench:
    image: intracom/nstat:proxy
    privileged: true
    hostname: mtcbench-node
    depends_on:
      - nstat
    networks:
      sample_net:
        ipv4_address: 10.0.1.13

  mn01:
    image: intracom/nstat:proxy
    privileged: true
    hostname: mn01-node
    depends_on:
      - nstat
    networks:
      sample_net:
        ipv4_address: 10.0.1.14

  mn02:
    image: intracom/nstat:proxy
    privileged: true
    hostname: mn02-node
    depends_on:
      - nstat
    networks:
      sample_net:
        ipv4_address: 10.0.1.15

networks:
  sample_net:
    driver: bridge
    ipam:
      driver: default
      config:
      - subnet: 10.0.1.0/24
        gateway: 10.0.1.1
